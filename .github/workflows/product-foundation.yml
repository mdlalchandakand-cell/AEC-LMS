name: Product foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, custom/product-foundation, backend/php-api-foundation, ci/robust-migration-safety-check, test/mysql-migration-integration, 'feature/**']

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend install, type-check and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Build production frontend
        run: |
          bun run build
          test -f dist/index.html
          test -f dist/.htaccess

  backend:
    name: PHP 8.3 syntax and migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, bcmath, curl, dom, fileinfo, intl, xml, zip
          coverage: none
      - name: Lint PHP source
        run: |
          find api scripts backend -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Check migration safety
        run: php scripts/check-migration-safety.php
      - name: Resolve and validate Laravel 12 dependencies
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/private
          if [ -f composer.lock ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi
          composer validate --strict
      - name: Persist initial Composer lock on the feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          if git ls-files --error-unmatch backend/composer.lock >/dev/null 2>&1; then
            echo "Composer lock is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock
          git commit -m "chore(backend): pin Laravel dependency versions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Run Laravel backend feature tests
        working-directory: backend
        run: |
          cp .env.example .env
          composer test

  mysql-integration:
    name: MySQL migrations and schema integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: aec_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up PHP 8.3 with MySQL driver
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Apply migrations and verify database schema
        env:
          AEC_TEST_DB_HOST: 127.0.0.1
          AEC_TEST_DB_PORT: 3306
          AEC_TEST_DB_NAME: aec_test
          AEC_TEST_DB_USER: root
          AEC_TEST_DB_PASS: test-root-password
        run: php scripts/test-mysql-migrations.php
      - name: Run PHP API HTTP integration tests
        env:
          AEC_TEST_DB_HOST: 127.0.0.1
          AEC_TEST_DB_PORT: 3306
          AEC_TEST_DB_NAME: aec_test
          AEC_TEST_DB_USER: root
          AEC_TEST_DB_PASS: test-root-password
          AEC_DB_HOST: 127.0.0.1
          AEC_DB_PORT: 3306
          AEC_DB_NAME: aec_test
          AEC_DB_USER: root
          AEC_DB_PASS: test-root-password
        run: |
          php scripts/test-php-api-integration.php
          php scripts/test-account-lifecycle.php
